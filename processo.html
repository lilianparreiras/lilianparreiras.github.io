<p class="texto-descricao">
            </p>
            </div>
<div id="conteudo-processos"></div>

<script>
  fetch('conteudo.json')
    .then(r => r.json())
    .then(data => {
      const container = document.getElementById('conteudo-processos');
      // Filtra apenas o que for para processos
      const posts = data.posts.filter(p => p.pagina === 'processos');
      
      posts.forEach(p => {
        const item = document.createElement('div');
        item.className = 'post-processos';
        let img = p.foto ? `<img src="${p.foto}" style="max-width:100%;">` : '';
        item.innerHTML = `<h3>${p.title}</h3>${img}<div>${p.body}</div>`;
        container.appendChild(item);
      });
    });
</script>

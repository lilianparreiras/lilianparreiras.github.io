backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "site_feed"
    label: "Gerenciar Site"
    files:
      - file: "conteudo.json" 
        label: "Publicações e Fotos"
        name: "publicacoes"
        fields:
          - name: posts
            label: "Lista de Itens"
            widget: list
            fields:
              - { label: "Título", name: "title", widget: "string" }
              
              # 🌟 O CAMPO NOVO ESTÁ AQUI:
              - label: "Para qual página vai?"
                name: "pagina"
                widget: "select"
                options:
                  - { label: "Página Inicial (Home)", value: "home" }
                  - { label: "Galeria de Fotos", value: "fotos" }
                  - { label: "Página Sobre", value: "sobre" }
              
              - { label: "Escolher Foto", name: "foto", widget: "image", required: false }
              - { label: "Texto / Descrição", name: "body", widget: "markdown" }

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poética do cansaço</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
    <style>
        /* Garante que a splash ocupe a tela inteira de forma limpa nesta página */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita barras de rolagem na tela de entrada */
            background-color: #fcfaf7; /* Mesma cor de fundo do seu tema */
            font-family: 'Inter', sans-serif;
        }
        
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fcfaf7; 
            background-image: url('assets/textura-codigo.svg'); /* Aplica a textura de fundo */
            background-repeat: repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Formatação dos textos alinhada com a estética do site */
        .splash-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 48px;
            font-weight: normal;
            color: #1f1f1f;
            line-height: 1.3;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .splash-sub {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: normal;
            color: #555555;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .splash-text {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #333333;
            max-width: 600px;
            margin: 0 auto 30px auto;
            text-align: center;
            text-transform: lowercase !important; /* <--- ADICIONE O !IMPORTANT AQUI */
        }

        /* Botão limpo, conversando com o estilo do menu */
        #entrar-site {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            color: #080202;
            background-color: transparent;
            border: 1px solid #080202;
            padding: 12px 35px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: none !important; /* <--- ADICIONE O !IMPORTANT AQUI */
        }

        #entrar-site:hover {
            background-color: #080202;
            color: #fcfaf7;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-content" style="text-align: center; padding: 20px; max-width: 800px;">
            <p class="splash-text">Site artesanal criado para divulgação da pesquisa realizada durante o mestrado do Programa Associado de Pós-graduação em Artes Visuais (PPGAV/UFPE/UFPB)</p>
            <h1 class="splash-title">Poética do Cansaço</h1>
            <h2 class="splash-sub">O gesto repetitivo como prática artística</h2>
            <button id="entrar-site">Entrar</button>
        </div>
    </div>

    <script>
        // Configuração do Netlify Identity (se ainda usar para o CMS)
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }

        // O SEGREDO: Ao clicar no botão, ele muda de página em vez de só esconder o elemento
        document.getElementById("entrar-site").addEventListener("click", function() {
            window.location.href = "home.html";
        });
    </script>
</body>
</html>
